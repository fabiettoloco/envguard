[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envguard"
version = "0.1.0"
description = "Check environment configuration and likely secrets before deployment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "envguard contributors" }]
keywords = ["security", "environment", "secrets", "devops", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
envguard = "envguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/envguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
